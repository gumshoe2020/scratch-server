[advisories]
db-path = ".advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
maximum-db-staleness = "P14D"
# Transitive hax-lib-macros 0.3.7 dependency under cfg(hax) only; not built
# by this application or Verus. No patched release. Do not ignore vulnerabilities.
ignore = ["RUSTSEC-2026-0173"]

[licenses]
confidence-threshold = 0.95
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause", "ISC"]

# Workspace crates are MIT-licensed; check them alongside third-party crates.

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
