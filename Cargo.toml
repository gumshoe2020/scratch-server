[package]
license = "MIT"
name = "scratch-server"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = ["crates/http-subset", "crates/transport-core"]

[dependencies]
transport-core = { version = "=0.1.0", path = "crates/transport-core" }
http-subset = { version = "=0.1.0", path = "crates/http-subset" }

bertie-tls = { version = "=0.1.0-pre.2", git = "https://github.com/gumshoe2020/bertie-tls", rev = "9b55643a3724bf347dd45e998844bf18776dfccd", default-features = false, features = ["api", "std", "defensive", "sha256", "sha384", "sha512", "chacha20poly1305", "ecdsa-p256", "x25519", "p256", "mlkem768"] }
rand = "0.9"
p256 = { version = "0.14", features = ["pkcs8", "pem"] }
pem-rfc7468 = { version = "0.7", features = ["alloc"] }
zeroize = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std", "custom-provider"] }
getrandom = { version = "0.3", features = ["std"] }
libcrux-chacha20poly1305 = "=0.0.10"
libcrux-curve25519 = "=0.0.9"
libcrux-sha2 = "=0.0.9"
libcrux-hmac = "=0.0.9"
libcrux-hkdf = "=0.0.9"
libcrux-secrets = "=0.0.7"
libcrux-ecdsa = { version = "=0.0.9", default-features = false, features = ["rand"] }
rand_core = "0.10"
pkcs8 = { version = "0.10", features = ["alloc"] }
sec1 = "0.7"

rcgen = { version = "=0.14.5", default-features = false }
httparse = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
