name: Proofs
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify pinned Verus roots and write receipts
        run: |
          mkdir -p logs
          ./verification/verify.sh > logs/proofs.log 2>&1 || { tail -n 40 logs/proofs.log; exit 1; }
