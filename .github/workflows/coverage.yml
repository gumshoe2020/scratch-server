name: Coverage
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch locked dependencies
        run: |
          mkdir -p logs
          cargo fetch --locked > logs/fetch.log 2>&1 || { tail -n 40 logs/fetch.log; exit 1; }
      - name: Verify pinned Verus roots and write receipts
        run: |
          mkdir -p logs
          ./verification/verify.sh > logs/proofs.log 2>&1 || { tail -n 40 logs/proofs.log; exit 1; }
      - uses: gumshoe2020/formal-coverage/.github/actions/coverage@2c7e26a8c90afb44323ecebce69822e8b4bc9ca5
        with:
          workspace: '.'
          report-args: '["--verus-log", "logs/verus-http-subset-lib.log", "--verus-log", "logs/verus-transport-core-lib.log", "--verus-log", "logs/verus-transport-core-aead.log", "--verus-log", "logs/verus-transport-core-hello.log"]'
          baseline: coverage/baseline.json
          coverage: COVERAGE.md
          config: coverage/ci.json
          artifact-name: coverage-badges
  publish-badges:
    needs: coverage
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.coverage.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: gumshoe2020/formal-coverage/.github/actions/publish-badges@2c7e26a8c90afb44323ecebce69822e8b4bc9ca5
        with:
          artifact-name: coverage-badges
          coverage-result: ${{ needs.coverage.result }}
